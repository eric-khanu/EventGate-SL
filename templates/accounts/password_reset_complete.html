{# accounts/templates/accounts/password_reset_complete.html #}

{% block title %}Password changed · EventGate SL{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white border rounded-2xl p-7">
  <h1 class="text-3xl font-black">Password changed</h1>

    Your password has been updated.
    <a href="{% url 'accounts:login' %}" class="text-emerald-700 hover:underline">Sign in</a>.
  </p>
</div>
{% endblock %}
