{# accounts/templates/accounts/password_reset.html #}
{% extends "base.html" %}
{% block title %}Reset password · EventGate SL{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white border rounded-2xl p-7">
  <h1 class="text-3xl font-black">Reset password</h1>
  <p class="text-slate-600 mt-2">Enter your email and we'll send a reset link.</p>
  <form method="post" class="mt-5 space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit"
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg p-3 font-bold">
      Send reset link
    </button>
  </form>
</div>
{% endblock %}
